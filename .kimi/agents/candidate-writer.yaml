# Claude-side equivalent: .claude/agents/candidate-writer.md (tools: Read, Write, Edit, Glob — no shell)
version: 1
agent:
  name: candidate-writer
  extend: ./_common.yaml
  system_prompt_path: ./candidate-writer.md
  allowed_tools:
    - "kimi_cli.tools.file:ReadFile"
    - "kimi_cli.tools.file:WriteFile"
    - "kimi_cli.tools.file:StrReplaceFile"
    - "kimi_cli.tools.file:Glob"
    - "kimi_cli.tools.file:Grep"
  exclude_tools:
    - "kimi_cli.tools.shell:Shell"              # hard boundary: never runs anything
  subagents:
