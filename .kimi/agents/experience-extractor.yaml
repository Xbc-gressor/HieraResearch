# Claude-side equivalent: .claude/agents/experience-extractor.md (tools: Read, Write, Bash, Glob)
version: 1
agent:
  name: experience-extractor
  extend: ./_common.yaml
  system_prompt_path: ./experience-extractor.md
  allowed_tools:
    - "kimi_cli.tools.shell:Shell"
    - "kimi_cli.tools.file:ReadFile"
    - "kimi_cli.tools.file:WriteFile"
    - "kimi_cli.tools.file:Glob"
    - "kimi_cli.tools.file:Grep"
  exclude_tools:
    - "kimi_cli.tools.file:StrReplaceFile"
  subagents:
