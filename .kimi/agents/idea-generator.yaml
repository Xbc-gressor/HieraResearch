# Claude-side equivalent: .claude/agents/idea-generator.md (tools: Read, Bash, Glob)
version: 1
agent:
  name: idea-generator
  extend: ./_common.yaml
  system_prompt_path: ./idea-generator.md
  allowed_tools:
    - "kimi_cli.tools.shell:Shell"
    - "kimi_cli.tools.file:ReadFile"
    - "kimi_cli.tools.file:Glob"
    - "kimi_cli.tools.file:Grep"
  exclude_tools:
    - "kimi_cli.tools.file:WriteFile"
    - "kimi_cli.tools.file:StrReplaceFile"
  subagents:
