[project]
name = "hard-interactions"
version = "0.1.0"
description = "Hard synthetic tabular classification with high-order feature interactions and large headroom."
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    "optuna>=3.6.0",
    "cma>=3.3.0",
    "cmaes>=0.10.0",
    "smac>=2.0",
]
