name = "tabular-blind"
description = "Synthetic tabular classification with a hidden generating process; structure must be found by experiment."

[env]
type = "uv"
project = "tasks/tabular-blind"

[run]
working_dir = "tasks/tabular-blind"
timeout_seconds = 600

# The single config->score evaluation function. score_fn(make_model, params) -> float,
# lower-is-better; the ONE surface. Semantics + hard rules in TASK.md.
[evaluation]
score_fn = "evaluate_config"

[result]
metric = "neg_mean_balanced_accuracy"
parser = "tools/parse_result.py"
required_patterns = ["^score:", "^best_model:"]
results_file = "ledger.json"

[constraints]
editable_files = ["train.py", "pyproject.toml", "uv.lock"]
readonly_files = ["prepare.py", "data/datasets.npz"]
allow_dependencies = true
