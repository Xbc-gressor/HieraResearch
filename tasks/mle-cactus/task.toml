name = "mle-cactus"
description = "Aerial Cactus Identification: public-training validation ROC AUC (scored as 1 - AUC) and a separate final MLE-bench submission."

[env]
type = "uv"
project = "envs/mle"

[run]
working_dir = "tasks/mle-cactus"
timeout_seconds = 300


[evaluation]
score_fn = "evaluate_config"
environment_preflight_fn = "preflight_environment"
preflight_fn = "preflight_config"
resource_probe_fn = "resource_probe_config"

[resources]
accelerator = "cuda"
devices = 1
lease_wait_timeout = 600
min_memory_gib = 8

[result]
metric = "one_minus_auc"
required_patterns = ["^score:"]
# Ambitious target on the metric scale: the official mle-bench leaderboard
# is saturated (1221 teams; gold, silver, and bronze all sit at AUC 1.0),
# so every medal tier maps to a perfect 1 - AUC of 0.0. Validation scores
# track but do not equal the private-leaderboard score.
target_score = 0.0

[constraints]
editable_files = ["train.py", "pyproject.toml"]
readonly_files = ["prepare.py"]
allow_dependencies = true

[mlebench]
competition_id = "aerial-cactus-identification"
public_data_env = "MLEBENCH_PUBLIC_DATA"
submission = "submission.csv"
