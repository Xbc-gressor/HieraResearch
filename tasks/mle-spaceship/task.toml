name = "mle-spaceship"
description = "Spaceship Titanic: public-training validation accuracy (scored as 1 - accuracy) and a separate final MLE-bench submission."

[env]
type = "uv"
project = "envs/mle"

[run]
working_dir = "tasks/mle-spaceship"
timeout_seconds = 300

[seed]
target_count = 1
provided = ["train.py"]
entrypoint = "train.py"

[evaluation]
score_fn = "evaluate_config"
environment_preflight_fn = "preflight_environment"

[resources]
accelerator = "cuda"
devices = 1
lease_wait_timeout = 600
min_memory_gib = 8

[result]
metric = "one_minus_accuracy"
required_patterns = ["^score:"]

[constraints]
editable_files = ["train.py", "pyproject.toml"]
readonly_files = ["prepare.py"]
allow_dependencies = true

[mlebench]
competition_id = "spaceship-titanic"
public_data_env = "MLEBENCH_PUBLIC_DATA"
submission = "submission.csv"
