name = "autoresearch-baseline"
description = "Original torch-based autoresearch pretraining task."

[env]
type = "uv"
project = "tasks/autoresearch-baseline"

[resources]
accelerator = "cuda"

[run]
working_dir = "tasks/autoresearch-baseline"
prepare_command = "uv run python prepare.py"
timeout_seconds = 900

[seed]
target_count = 1
# Both experiment protocols admit this exact entrypoint as their observed
# starting control.
provided = ["train.py"]
entrypoint = "train.py"

# The single config->score evaluation function. Semantics + hard rules live in
# TASK.md's `## Evaluation Contract`. score_fn(make_model, params) -> float,
# lower-is-better; it is the ONE surface (warm-start eval + Phase C tuning) for
# the experiment loop. The standalone `python train.py` run (manual/hillclimb)
# still prints the summary parsed via [result].
[evaluation]
score_fn = "evaluate_config"
environment_preflight_fn = "preflight_environment"
preflight_fn = "preflight_config"
# Optional no-score resource oracle for the search-space clamp: same contract as
# preflight_fn, but pinned to the worst-case training shape (T = MAX_SEQ_LEN).
# Without it the clamp falls back to trusting preflight_fn's own shape.
resource_probe_fn = "resource_probe_config"

[result]
metric = "val_bpb"
required_patterns = ["^val_bpb:", "^peak_vram_mb:"]

[constraints]
editable_files = ["train.py"]
readonly_files = ["prepare.py"]
allow_dependencies = false
