name = "mle-nomad2018"
description = "NOMAD 2018 Predicting Transparent Conductors: public-training validation RMSLE over formation energy and band gap, with a separate final submission."

[env]
type = "uv"
project = "envs/mle"

[run]
working_dir = "tasks/mle-nomad2018"
timeout_seconds = 300


[evaluation]
score_fn = "evaluate_config"
environment_preflight_fn = "preflight_environment"
preflight_fn = "preflight_config"
resource_probe_fn = "resource_probe_config"

[resources]
accelerator = "cuda"
devices = 1
lease_wait_timeout = 600
min_memory_gib = 8

[result]
metric = "mean_rmsle"
required_patterns = ["^score:"]
# Aspiration-bar tiers from the official mle-bench leaderboard rule
# (879 teams, 2026-09-17). The official score sums the two per-target
# RMSLEs while this metric averages them, so leaderboard thresholds are
# halved onto this scale. target_tier picks the active bar;
# TARGET_TIER=<tier> overrides it per run (E2E A/B) and the run's frozen
# objective_brief.json records the selection. Validation scores track but
# do not equal the private-leaderboard score.
target_tier = "gold"
target_tiers = { gold = 0.027945, silver = 0.031145 }

[constraints]
editable_files = ["train.py", "pyproject.toml"]
readonly_files = ["prepare.py"]
allow_dependencies = true

[mlebench]
competition_id = "nomad2018-predict-transparent-conductors"
public_data_env = "MLEBENCH_PUBLIC_DATA"
submission = "submission.csv"
