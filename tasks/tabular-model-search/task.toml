name = "tabular-model-search"
description = "CPU-friendly tabular classification model search on noisy synthetic sklearn datasets."

[env]
type = "uv"
project = "tasks/tabular-model-search"

[run]
working_dir = "tasks/tabular-model-search"
timeout_seconds = 300

# The single config→score evaluation function. Semantics + hard rules live in
# TASK.md's `## Evaluation Contract`. score_fn(make_model, params) -> float,
# lower-is-better; it is the ONE surface (warm-start eval + Phase C tuning), no
# separate official run. (No seed phase: the loop bootstraps with `fresh`.)
[evaluation]
score_fn = "evaluate_config"

[result]
metric = "neg_mean_test_accuracy"
required_patterns = ["^score:", "^best_model:"]

[constraints]
editable_files = ["train.py", "pyproject.toml", "uv.lock"]
readonly_files = ["prepare.py"]
allow_dependencies = true
