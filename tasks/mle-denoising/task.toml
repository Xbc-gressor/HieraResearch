name = "mle-denoising"
description = "Denoising Dirty Documents: public image-to-image validation RMSE and a separate final MLE-bench submission."

[env]
type = "uv"
project = "envs/mle"

[run]
working_dir = "tasks/mle-denoising"
timeout_seconds = 300


[evaluation]
score_fn = "evaluate_config"
environment_preflight_fn = "preflight_environment"
preflight_fn = "preflight_config"
resource_probe_fn = "resource_probe_config"

[resources]
accelerator = "cuda"
devices = 1
lease_wait_timeout = 600
min_memory_gib = 8

[result]
metric = "pixel_rmse"
required_patterns = ["^score:"]
# Aspiration-bar tiers from the official mle-bench leaderboard rule
# (162 teams, 2026-09-17). target_tier picks the active bar;
# TARGET_TIER=<tier> overrides it per run (E2E A/B) and the run's frozen
# objective_brief.json records the selection. Validation scores track but
# do not equal the private-leaderboard score.
target_tier = "gold"
target_tiers = { gold = 0.01794, silver = 0.02609 }

[constraints]
editable_files = ["train.py", "pyproject.toml"]
readonly_files = ["prepare.py"]
allow_dependencies = true

[mlebench]
competition_id = "denoising-dirty-documents"
public_data_env = "MLEBENCH_PUBLIC_DATA"
submission = "submission.csv"
